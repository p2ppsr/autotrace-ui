# Exact @cwi/autotrace0.1.8 archive is unavailable.
# This manual build must remain fail-closed until that exact artifact is recovered.
name: Archival restoration build (dependency blocked)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Verify patched build runtime
        run: node -e "const a=require('node:assert/strict'),z=require('node:zlib');a.equal(process.version,'v22.23.4');a.equal(z.brotliDecompressSync(z.brotliCompressSync(Buffer.from('security'))).toString(),'security');console.log(process.version)"
      - name: Install frozen historical dependency graph
        run: npm ci --legacy-peer-deps --fetch-retries=0 --fetch-timeout=15000
      - name: Build retained source
        run: npm run build
